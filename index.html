<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clue Crackers: detective-themed practice for 11+ critical thinking.">
<title>Clue Crackers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a detective's desk — one column of case folders; each case opens to a briefing, then one puzzle card at a time. Dark by default, with a light mode toggle. */
:root{
  --ink:#131a26;      /* desk background */
  --desk:#1b2434;     /* card surface */
  --raised:#243046;   /* buttons, inputs */
  --line:#34425c;
  --manila:#dcb76c;   /* folder accent */
  --manila-ink:#2a2010;
  --btn:#dcb76c;      /* main buttons, folder tabs */
  --btn-ink:#2a2010;
  --fg:#ece7da;
  --muted:#a3acbe;
  --stamp:#e2625a;    /* wrong / stamp */
  --ok:#72c9a0;       /* correct */
  --font-display:"Special Elite","Courier New",monospace;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root.light{
  --ink:#e9edf4; --desk:#ffffff; --raised:#eef1f7; --line:#c5cddc;
  --manila:#8a5a08; --manila-ink:#2a2010; --btn:#e2b85c; --btn-ink:#2a2010;
  --fg:#1c2433; --muted:#5a6477; --stamp:#c0392b; --ok:#1d8656;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2rem;color:var(--manila)}
h2{font-size:1.5rem}
h3{font-size:1.15rem;color:var(--manila)}
p{margin:0}
.label{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--manila);outline-offset:2px}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:8px;padding:12px 20px;font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header.top p{color:var(--muted)}

/* folders */
.folders{display:grid;gap:16px}
.folder{position:relative;text-align:left;background:var(--desk);border:1.5px solid var(--line);border-radius:4px 12px 12px 12px;padding:22px 20px 18px;display:grid;gap:6px}
.folder::before{content:attr(data-tab);position:absolute;top:-14px;left:-1.5px;background:var(--btn);color:var(--btn-ink);font-family:var(--font-display);font-size:.8rem;padding:2px 14px 0;border-radius:6px 6px 0 0}
.folder:hover{border-color:var(--manila)}
.folder .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.stamp{font-family:var(--font-display);color:var(--stamp);border:2.5px solid var(--stamp);border-radius:6px;padding:2px 10px;transform:rotate(-6deg);display:inline-block;letter-spacing:.08em}
.folder .stamp{position:absolute;right:16px;top:14px}

/* briefing */
.card{background:var(--desk);border:1.5px solid var(--line);border-radius:12px;padding:22px 20px;display:grid;gap:14px;min-width:0}
.rule{font-family:var(--font-display);font-size:1.3rem;color:var(--manila);border:1.5px dashed var(--manila);border-radius:8px;padding:12px 14px;text-align:center}
ol.steps{margin:0;padding-left:1.3em;display:grid;gap:8px}
.from-test{color:var(--muted);font-size:.92rem}

/* puzzle */
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--ok)}
.dot.miss{background:var(--stamp)}
.dot.now{outline:2px solid var(--manila);outline-offset:2px}
.q{display:grid;gap:8px}
.q ul{margin:0;padding-left:1.2em}
.q .ask{font-weight:700}
table.ev{border-collapse:collapse;margin-top:4px}
table.ev th,table.ev td{border:1px solid var(--line);padding:6px 12px;text-align:center}
table.ev th{color:var(--muted);font-weight:400;font-size:.9rem}
.scroll{overflow-x:auto}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--raised);border:1.5px solid transparent;border-radius:8px;padding:12px 14px}
.opt b{font-family:var(--font-display);color:var(--manila);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--manila)}
.opt.right{border-color:var(--ok)}
.opt.wrong{border-color:var(--stamp);opacity:.75}
.opt:disabled{cursor:default}
.clues{display:grid;gap:8px}
.alert{border:2px solid var(--stamp);border-radius:10px;padding:12px 14px;display:grid;gap:6px;background:color-mix(in srgb,var(--stamp) 10%,var(--desk))}
.alert .t{font-family:var(--font-display);color:var(--stamp);font-size:1.1rem;letter-spacing:.04em}
.alert ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.arr{border:1.5px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.arr.ok{border-color:var(--ok)}
.arr.no{border-color:var(--stamp);opacity:.8}
.mini{padding:4px 10px;font-size:.82rem;font-weight:400}
.mini.on{border-color:var(--manila);color:var(--manila)}
.np-hint{background:color-mix(in srgb,var(--manila) 14%,var(--desk));border-radius:6px;padding:8px 12px}
.recap{border-top:1px dashed var(--line);padding-top:8px}
.badge{display:grid;gap:2px;justify-items:end;text-align:right}
.badge b{font-family:var(--font-display);font-weight:400;font-size:1.2rem;color:var(--manila)}
.badge span:not(.label){color:var(--muted);font-size:.9rem}
.story h2{color:var(--fg)}
.evid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.ev-card{border:1.5px dashed var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;color:var(--muted);min-width:0}
.ev-card.open{border-style:solid;border-color:var(--manila);color:var(--fg);background:color-mix(in srgb,var(--manila) 8%,var(--desk))}
.ev-card.unlock{text-align:left;max-width:420px}
.hint{color:var(--muted);font-size:.9rem}
.pts{font-weight:700;color:var(--manila)}
.gain{font-weight:700;color:var(--ok)}
.streak{color:var(--manila);font-weight:700}
.suspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.suspect{position:relative;background:var(--raised);border:1.5px solid var(--line);border-radius:10px;padding:14px 10px;display:grid;gap:4px;justify-items:center;text-align:center}
.suspect:hover:not(:disabled){border-color:var(--manila)}
.suspect .face{font-size:2.2rem;line-height:1}
.suspect small{color:var(--muted)}
.suspect .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.chip{font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.suspect.out{opacity:.55}
.suspect.win{border-color:var(--ok)}
.suspect .stamp{position:absolute;top:10px;right:6px;font-size:.8rem;background:var(--desk)}
.suspect.win .stamp{color:var(--ok);border-color:var(--ok)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:no-preference){.pop-in{display:inline-block;animation:popin .4s ease-out}@keyframes popin{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.ev-card.unlock{animation:glow 1.2s ease-out}@keyframes glow{from{box-shadow:0 0 0 6px color-mix(in srgb,var(--manila) 50%,transparent)}to{box-shadow:0 0 0 0 transparent}}}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.resume{border:2px solid var(--btn);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--btn) 12%,var(--desk))}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebox input,.backup textarea{font:inherit;color:var(--fg);background:var(--raised);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.namebox input{flex:1 1 160px}
.backup{display:grid;gap:8px}
.backup textarea{width:100%;min-height:70px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
.small{font-size:.85rem}
.clue{background:color-mix(in srgb,var(--manila) 12%,var(--desk));border-left:3px solid var(--manila);border-radius:4px;padding:8px 12px}
.fb{border-radius:8px;padding:14px;display:grid;gap:8px}
.fb.good{background:color-mix(in srgb,var(--ok) 14%,var(--desk));border:1.5px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--stamp) 14%,var(--desk));border:1.5px solid var(--stamp)}
.fb strong{font-family:var(--font-display);font-weight:400;font-size:1.1rem}

/* scratch board */
.board{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.board .hint{color:var(--muted);font-size:.88rem}
.seats-row{display:grid;gap:8px}
.seat{background:var(--raised);border:1.5px solid var(--line);border-radius:8px;min-height:58px;padding:6px 4px;display:grid;place-items:center;font-weight:700;font-size:.95rem}
.seat small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.seat.filled{border-color:var(--manila);color:var(--manila)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem}
.circle-box{position:relative;width:min(100%,300px);aspect-ratio:1;max-width:100%;margin:0 auto}
.circle-box svg{position:absolute;inset:0;width:100%;height:100%}
.circle-box .seat{position:absolute;width:78px;min-height:48px;transform:translate(-50%,-50%)}

.end{text-align:center;justify-items:center}
.end .stamp{font-size:1.8rem;margin:6px 0}
.stars{font-family:var(--font-display);font-size:1.3rem;color:var(--manila)}
.grownups{color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:rotate(-6deg) scale(1.6);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}}
.folder h2{padding-right:96px}
.mystery{display:grid;gap:16px;padding-top:8px}
.lvls{display:flex;gap:4px}
.lv{font-size:.72rem;border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--muted)}
.lv.open{border-color:var(--ok);color:var(--ok)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lvbtn{text-align:left;background:var(--raised);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.lvbtn b{font-family:var(--font-display);font-weight:400;color:var(--manila)}
.lvbtn small{color:var(--muted)}
.lvbtn.on{border-color:var(--btn);box-shadow:0 0 0 2px color-mix(in srgb,var(--btn) 40%,transparent)}
.lvbtn:disabled{opacity:.55;cursor:default}
.unlocked{font-weight:700;color:var(--ok)}
table.lgrid{border-collapse:collapse;margin:0 auto}
table.lgrid th,table.lgrid td{border:1px solid var(--line);padding:0;text-align:center}
table.lgrid th{font-weight:400;color:var(--muted);font-size:.78rem;padding:4px 6px}
table.lgrid th.grp{color:var(--manila);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
table.lgrid th.rh{text-align:left;color:var(--fg);font-weight:700;white-space:nowrap}
table.lgrid th.ch{vertical-align:bottom;max-width:64px}
table.lgrid th.ch span{display:block;line-height:1.15}
.cell{width:100%;min-width:32px;height:36px;border:0;background:var(--raised);font-weight:700;font-size:1rem}
.cell.v1{color:var(--stamp)} .cell.v2{color:var(--ok)}
td.cnt{font-weight:700;color:var(--manila);min-width:38px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const CASES = [
{
  id:"seats", tab:"CASE 1", title:"The Seating Plan Mysteries",
  blurb:"Who sits where? Rows, round tables and race results.",
  rule:"Draw it. Check left and right. Use every “not”.",
  steps:[
    "Draw the seats first: a numbered row, or a circle with everyone facing the middle.",
    "Put the fixed facts in first (“Dot is at the end”).",
    "Try every possibility for the rest — don't stop at the first one that works.",
    "If two arrangements both fit and give different answers, the answer is “not possible to tell”.",
    "🚨 Trap alert: if you see “not possible to tell” in the answers, STOP after your first arrangement and hunt for a second one. List every place the most restricted person (or pair) could go, tick ✅ or cross ❌ each one, then count the ticks.",
    "Left and right in a circle: turn the page so the person is at the bottom. Now their left is your left. A person at the top faces you, so their left is on your right."
  ],
  fromTest:"From your test: Q9, Q10, Q15, Q23, Q25, Q31.",
  evidence:"A witness saw the thief sitting in the BACK ROW at rehearsal.",
  puzzles:[
    {board:{type:"row",names:["Amir","Bea","Cal","Dot"]},
     q:`<p>Amir, Bea, Cal and Dot sit in a row of four seats, numbered 1 to 4 from left to right. They all face the same way as you, so their left is your left.</p>
        <ul><li>Dot sits at the right-hand end.</li><li>Amir sits next to Dot, on Dot's left.</li><li>Bea is not next to Amir.</li></ul>
        <p class="ask">Who is in seat 2?</p>`,
     opts:["Amir","Bea","Cal","It is not possible to tell"], a:2,
     clues:["Fixed fact first: Dot is in seat 4.","Amir is next to Dot on his left, so Amir is in seat 3.","Bea can't be next to Amir, so she can't be in seat 2. Who is left?"],
     why:["Amir is next to Dot, so he's in seat 3.","Seat 2 is next to Amir, and Bea is NOT next to Amir.",null,"Every clue fixes a seat, so there's only one arrangement. We can tell."],
     explain:"Bea, Cal, Amir, Dot. The “not” clue about Bea is what decides seat 2."},
    {board:{type:"row",names:["Ella","Finn","Gus","Hana"]},
     q:`<p>Ella, Finn, Gus and Hana sit side by side in a row, all facing the same way as you.</p>
        <ul><li>Hana is not at either end.</li><li>Finn sits next to Ella, on Ella's left.</li></ul>
        <p class="ask">Who is sitting on Hana's right?</p>`,
     opts:["Finn","Gus","Ella","It is not possible to tell"], a:3,
     clues:["Hana must be in seat 2 or seat 3. Try BOTH.","Finn and Ella sit together, with Finn on the left. Where can that pair go each time?","Arrangement 1: Gus, Hana, Finn, Ella. Arrangement 2: Finn, Ella, Hana, Gus. Who is on Hana's right in each?"],
     why:["True for Gus, Hana, Finn, Ella — but not for Finn, Ella, Hana, Gus.","True for Finn, Ella, Hana, Gus — but not for the other arrangement.","Ella is never directly on Hana's right.",null],
     explain:"Two arrangements both fit every clue, and they give different answers. That means it is not possible to tell. This is exactly the trap in Q10 of your test."},
    {board:{type:"circle",names:["Ivy","Jay","Kit","Leo"]},
     q:`<p>Ivy, Jay, Kit and Leo sit equally spaced around a round table, all facing the middle.</p>
        <ul><li>Ivy sits opposite Jay.</li><li>Kit sits on Ivy's left.</li></ul>
        <p class="ask">Who sits on Jay's left?</p>`,
     opts:["Ivy","Kit","Leo","It is not possible to tell"], a:2,
     clues:["Put Ivy at the bottom of the circle, facing up. Her left is your left.","So Kit is on the left side of the circle, and Jay is at the top.","Jay is at the top, facing DOWN towards you. His left is on YOUR right. Who sits there?"],
     why:["Ivy is opposite Jay, not next to him.","Kit is on your left — but Jay faces you, so Kit is on Jay's RIGHT. This is the left-right trap!",null,"Once Ivy is placed, every seat is fixed."],
     explain:"Ivy at the bottom, Kit on the left, Jay at the top, Leo on the right. Jay faces down, so his left is the right-hand side of the page: Leo."},
    {board:{type:"circle",names:["Mo","Nia","Oli","Pip","Raj"]},
     q:`<p>Five children — Mo, Nia, Oli, Pip and Raj — stand in a ring holding hands, all facing inwards.</p>
        <ul><li>Mo is on Nia's right.</li><li>Oli is on Mo's right.</li><li>Pip is not next to Oli.</li></ul>
        <p class="ask">Who is on Nia's left?</p>`,
     opts:["Mo","Oli","Raj","Pip"], a:3,
     clues:["Put Nia at the bottom. Her right is your right, so Mo goes just to the right of her.","Keep going round the same way: Oli goes next to Mo. Two places are left — one next to Oli, one on Nia's left.","Pip can't be next to Oli. So where must Pip go?"],
     why:["Mo is on Nia's RIGHT, not her left.","Oli is two places away from Nia.","If Raj were on Nia's left, Pip would have to stand next to Oli — that breaks a clue.",null],
     explain:"Going round to the right: Nia, Mo, Oli, Raj, Pip. Pip is on Nia's left. In Q31 the same left/right idea decided the answer."},
    {board:{type:"row",names:["Sam","Tia","Uma","Vic"],labels:["1st","2nd","3rd","4th"],ends:false},
     q:`<p>Sam, Tia, Uma and Vic ran a race. There were no ties.</p>
        <ul><li>Tia finished ahead of Sam.</li><li>Uma finished ahead of Vic.</li><li>Sam did not come last.</li></ul>
        <p class="ask">Which one of these <u>must</u> be true?</p>`,
     opts:["Tia won the race.","Uma beat Sam.","Vic came last.","Sam came third."], a:2,
     clues:["Go through each runner and ask: could they be last?","Tia beat someone, so she can't be last. Uma beat someone too. And Sam is not last.","Only one runner is left who could be last."],
     why:["Uma could have won: Uma, Tia, Sam, Vic fits every clue.","Tia, Sam, Uma, Vic also fits, and there Sam beats Uma.",null,"Sam could be 2nd: Tia, Sam, Uma, Vic."],
     explain:"“Must be true” means true in EVERY possible order. Vic is the only runner who can be last. Same trick as Q15, where “Graeme was not lowest” was the key."},
    {board:{type:"row",names:["Ash","Bell","Cole","Dunn"],labels:["No. 1","No. 2","No. 3","No. 4"],ends:false},
     q:`<p>The Ash, Bell, Cole and Dunn families live in a row of four houses, numbered 1 to 4.</p>
        <ul><li>The Ash family live at number 1.</li><li>The Bell family live next door to the Dunn family.</li><li>The Cole family do not live next door to the Ash family.</li><li>The Dunn family live at an even-numbered house.</li></ul>
        <p class="ask">Who lives at number 3?</p>`,
     opts:["Bell","Cole","Dunn","It is not possible to tell"], a:0,
     clues:["Fixed fact first: Ash at 1. Cole can't be next to Ash, so Cole isn't at 2.","If Cole were at 3, Bell and Dunn would be at 2 and 4. Would they be next door?","So Cole is at 4. Dunn must be at an even number, and 4 is taken."],
     why:[null,"Cole at 3 would split Bell and Dunn up — they must be next door.","Dunn lives at an even number, so not 3.","The “even number” clue settles it. Use every clue before choosing “not possible”."],
     explain:"Ash, Dunn, Bell, Cole. Every clue was needed — just like Q25 in your test."}
  ]
},
{
  id:"logic", tab:"CASE 2", title:"The Logic Locks",
  blurb:"“Must be true”, if–then rules, and sneaky words like only, some and not.",
  rule:"Arrows only go forwards.",
  steps:[
    "Write each rule as an arrow: “All choir members read music” → Choir ➜ Reads music.",
    "Follow arrows forwards and join them into chains: A ➜ B ➜ C.",
    "Never turn an arrow round. Reads music does NOT lead to Choir.",
    "The backwards trick: flip it AND add “not”. Not reads music ➜ Not choir.",
    "Circle NOT in the question. Mark each statement True or False before looking at A–D.",
    "Watch the size words: all, some, often, only."
  ],
  fromTest:"From your test: Q5, Q6, Q20, Q40.",
  evidence:"Everyone who wears glasses signed the visitors' book. The thief did NOT sign it. (Use the backwards trick!)",
  extra:[
    {q:`<p>“All the pupils in Class 5B have a library card.”</p><p class="ask">If this is true, which one of these <u>must</u> also be true?</p>`,
     opts:["Ollie has a library card, so he must be in 5B.","Maya is in 5B, so she has a library card.","Everyone with a library card is in 5B.","Class 5B pupils love reading."], a:1,
     clues:["Write it as an arrow: 5B ➜ Library card.","Follow the arrow forwards only.","Which option starts with “in 5B”?"],
     why:["Arrow turned round. Lots of people have library cards.",null,"Arrow turned round again.","Not mentioned at all."],
     explain:"5B ➜ Library card. Maya is in 5B, so she has one."},
    {q:`<ul><li>Every animal in the zoo's Rainforest House is a tropical animal.</li><li>No tropical animal can live in the Polar Zone.</li></ul><p class="ask">Which one of these <u>must</u> be true?</p>`,
     opts:["If an animal is tropical, it lives in the Rainforest House.","If an animal lives in the Rainforest House, it can't live in the Polar Zone.","If an animal can't live in the Polar Zone, it lives in the Rainforest House.","All the animals in the Polar Zone are tropical."], a:1,
     clues:["Arrows: Rainforest House ➜ Tropical. Tropical ➜ Not Polar Zone.","Join them: Rainforest ➜ Tropical ➜ Not Polar.","Which option follows the chain forwards?"],
     why:["Arrow turned round. Tropical animals could live elsewhere.",null,"Chain turned round.","The opposite — tropical animals can't live in the Polar Zone."],
     explain:"Rainforest ➜ Tropical ➜ Not Polar Zone. Follow the chain forwards."},
    {q:`<p>“Only people with a ticket can enter the concert hall.”</p><p class="ask">If this is true, which one of these <u>must</u> be true?</p>`,
     opts:["Kim has a ticket, so she is in the concert hall.","Nobody without a ticket wants to go.","Raj is in the concert hall, so he has a ticket.","Everyone with a ticket enjoyed the concert."], a:2,
     clues:["“Only X can do Y” means Y ➜ X.","So: In the hall ➜ Has a ticket.","Which option matches that arrow?"],
     why:["Having a ticket lets you in — it doesn't mean you went.","Nothing is said about what people want.",null,"Nothing is said about enjoying it."],

/* ---------- puzzle generators (every answer is checked by a solver) ---------- */
const NAME_POOL=["Ava","Ben","Cleo","Dev","Eli","Fay","Gus","Isla","Jack","Kai","Lily","Max","Nora","Omar","Pia","Rex","Sana","Theo","Una","Zac"];
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function perms(arr){if(arr.length<=1)return [arr];const out=[];arr.forEach((x,i)=>{perms(arr.slice(0,i).concat(arr.slice(i+1))).forEach(p=>out.push([x].concat(p)))});return out}
function listNames(ns){return ns.length<2?ns.join(""):ns.slice(0,-1).join(", ")+" and "+ns[ns.length-1]}
const ORD=["1st","2nd","3rd","4th","5th","6th"];
const NP="It is not possible to tell";
/* drop clues one at a time while the puzzle still has the same answers */
function trimClues(clues,all,sameAs){
  let cs=clues.slice();
  for(let i=cs.length-1;i>=0;i--){const t=cs.filter((_,j)=>j!==i);const v=all.filter(a=>t.every(c=>c.f(a)));if(sameAs(v))cs=t}
  return cs;
}

/* ===== seating (rows and round tables) ===== */
function makeGeom(type,n){
  const pos=(arr,x)=>arr.indexOf(x);
  if(type==="row") return {
    left:(arr,x)=>{const k=pos(arr,x);return k>0?arr[k-1]:-1},
    right:(arr,x)=>{const k=pos(arr,x);return k<n-1?arr[k+1]:-1},
    next:(arr,x,y)=>Math.abs(pos(arr,x)-pos(arr,y))===1,
    end:(arr,x)=>{const k=pos(arr,x);return k===0||k===n-1},
    seat:(arr,x)=>pos(arr,x)};
  return {
    left:(arr,x)=>arr[(pos(arr,x)+1)%n],
    right:(arr,x)=>arr[(pos(arr,x)-1+n)%n],
    next:(arr,x,y)=>{const d=Math.abs(pos(arr,x)-pos(arr,y));return d===1||d===n-1},
    opp:(arr,x)=>n%2===0?arr[(pos(arr,x)+n/2)%n]:-1};
}
function genSeating(level){
  level=level||1;
  for(let attempt=0;attempt<3000;attempt++){
    let type,n,nClues;
    if(level===1){type=Math.random()<0.7?"row":"circle";n=4;nClues=2+rnd(2)}
    else if(level===2){type=Math.random()<0.5?"row":"circle";n=5;nClues=3+rnd(2)}
    else {type=Math.random()<0.45?"row":"circle";n=type==="row"?5+rnd(2):(Math.random()<0.6?6:5);nClues=4+rnd(2)}
    const names=shuffle(NAME_POOL).slice(0,n).sort();
    const G=makeGeom(type,n);
    let all=perms([...Array(n).keys()]);
    if(type==="circle") all=all.filter(a=>a[0]===0);
    const pick=()=>{const x=rnd(n);let y=rnd(n);while(y===x)y=rnd(n);return [x,y]};
    const kinds=type==="row"?["end","notEnd","next","notNext","leftOf","seat"].concat(level>1?["notNext","notEnd"]:[]):["next","notNext","leftOf","rightOf"].concat(n%2===0?["opp","notOpp"]:[]);
    const clues=[];
    for(let k=0;k<nClues;k++){
      const kind=kinds[rnd(kinds.length)], [x,y]=pick(), X=names[x], Y=names[y];
      let t,f;
      if(kind==="end"){t=`${X} sits at one end of the row.`;f=a=>G.end(a,x)}
      if(kind==="notEnd"){t=`${X} is not at either end of the row.`;f=a=>!G.end(a,x)}
      if(kind==="seat"){const s=rnd(n);t=`${X} sits in seat ${s+1}.`;f=a=>G.seat(a,x)===s}
      if(kind==="next"){t=`${X} sits next to ${Y}.`;f=a=>G.next(a,x,y)}
      if(kind==="notNext"){t=`${X} does not sit next to ${Y}.`;f=a=>!G.next(a,x,y)}
      if(kind==="leftOf"){t=`${X} sits next to ${Y}, on ${Y}'s left.`;f=a=>G.left(a,y)===x}
      if(kind==="rightOf"){t=`${X} sits next to ${Y}, on ${Y}'s right.`;f=a=>G.right(a,y)===x}
      if(kind==="opp"){t=`${X} sits opposite ${Y}.`;f=a=>G.opp(a,x)===y}
      if(kind==="notOpp"){t=`${X} does not sit opposite ${Y}.`;f=a=>G.opp(a,x)!==y}
      if(clues.some(c=>c.t===t)){k--;continue}
      clues.push({t,f});
    }
    const valid=all.filter(a=>clues.every(c=>c.f(a)));
    if(valid.length<1||valid.length>3) continue;
    if(clues.some((c,i)=>all.filter(a=>clues.every((d,j)=>j===i||d.f(a))).length===valid.length)) continue;
    const z=rnd(n), Z=names[z];
    const qs=type==="row"?["left","right","seatQ"]:["left","right"].concat(n%2===0?["opp"]:[]);
    const qk=qs[rnd(qs.length)];
    let ask,ansOf,seatNo=0;
    if(qk==="left"){ask=`Who is sitting on ${Z}'s left?`;ansOf=a=>G.left(a,z)}
    if(qk==="right"){ask=`Who is sitting on ${Z}'s right?`;ansOf=a=>G.right(a,z)}
    if(qk==="opp"){ask=`Who is sitting opposite ${Z}?`;ansOf=a=>G.opp(a,z)}
    if(qk==="seatQ"){seatNo=rnd(n);ask=`Who is in seat ${seatNo+1}?`;ansOf=a=>a[seatNo]}
    const answers=valid.map(ansOf);
    if(answers.some(v=>v<0)) continue;
    const uniq=[...new Set(answers)];
    const wantNP=Math.random()<0.4;
    if(wantNP!==(uniq.length>1)) continue;
    if(qk==="seatQ"&&clues.some(c=>c.t.endsWith(`seat ${seatNo+1}.`))) continue;
    let pool=uniq.slice(0,3);
    const others=shuffle([...Array(n).keys()].filter(i=>!pool.includes(i)&&(qk==="seatQ"||i!==z)));
    while(pool.length<3&&others.length) pool.push(others.shift());
    if(pool.length<3) continue;
    pool=shuffle(pool);
    const opts=pool.map(i=>names[i]).concat([NP]);
    const a=uniq.length>1?3:pool.indexOf(uniq[0]);
    const desc=arr=>type==="row"?arr.map(i=>names[i]).join(", "):`${names[arr[0]]} at the bottom, then going round to the left: `+arr.map(i=>names[i]).join(" → ");
    const list=valid.map((v,i)=>`(${i+1}) ${desc(v)}`).join("   ");
    const why=opts.map((o,i)=>{
      if(i===a) return null;
      if(i===3) return "Only one arrangement fits every clue, so we CAN tell.";
      return answers.includes(pool[i])?`${o} is right in one arrangement, but not in every one. Look for another arrangement.`:`${o} isn't the answer in any arrangement that fits all the clues.`;
    });
    const setting=type==="row"
      ?`<p>${listNames(names)} sit side by side in a row of ${n} seats, numbered 1 to ${n} from left to right. They all face the same way as you, so their left is your left.</p>`
      :`<p>${listNames(names)} sit equally spaced around a round table, all facing the middle.</p>`;
    return {gen:true,board:{type,names},
      q:`${setting}<ul>${clues.map(c=>`<li>${c.t}</li>`).join("")}</ul><p class="ask">${ask}</p>`,
      opts,a,why,
      clues:["Draw the seats on the scratch board. Put the most definite clue in first.",
        type==="circle"?"Put one person at the bottom of the circle. For them, left is your left. Then try every place for the next person.":"Try every place the most restricted person (or pair) could go. Tick ✅ or cross ❌ each arrangement.",
        valid.length===1?"Only ONE arrangement fits every clue. Find it, then answer.":`${valid.length} arrangements fit every clue. Find them all, then check: do they give the same answer?`],
      explain:(valid.length===1?"Only one arrangement fits every clue: ":`${valid.length} arrangements fit every clue: `)+list+(uniq.length>1?". They give different answers, so it is not possible to tell.":valid.length>1?`. They all give the same answer: ${names[uniq[0]]}.`:`. So the answer is ${names[uniq[0]]}.`)};
  }
  return null;
}

  {intro:n=>`${n} entered a baking contest and were ranked from 1st to last. There were no ties.`,ahead:"was ranked above",justAhead:"was ranked just above",first:"won the contest",last:"came last"}
];
function genRanking(level){
  level=level||1;
  for(let attempt=0;attempt<3000;attempt++){
    const n=level===1?4:level===2?5:(Math.random()<0.5?5:6);
    const names=shuffle(NAME_POOL).slice(0,n).sort();
    const C=RANK_CTX[rnd(RANK_CTX.length)];
    const all=perms([...Array(n).keys()]);              // order[0] is 1st place
    const P=(o,x)=>o.indexOf(x);
    const pick=()=>{const x=rnd(n);let y=rnd(n);while(y===x)y=rnd(n);return [x,y]};
    const kinds=["ahead","ahead","notLast","notFirst"].concat(level===1?["place"]:level===2?["place","ahead"]:["just","notTop2","notLast","ahead"]);
    const nClues=level===1?2+rnd(2):level===2?3+rnd(2):4+rnd(2);
    const clues=[];
    for(let k=0;k<nClues;k++){
      const kind=kinds[rnd(kinds.length)],[x,y]=pick(),X=names[x],Y=names[y];let t,f;
      if(kind==="ahead"){t=`${X} ${C.ahead} ${Y}.`;f=o=>P(o,x)<P(o,y)}
      if(kind==="just"){t=`${X} ${C.justAhead} ${Y}, with nobody in between.`;f=o=>P(o,x)===P(o,y)-1}
      if(kind==="notLast"){t=`${X} did not come last.`;f=o=>P(o,x)!==n-1}
      if(kind==="notFirst"){t=`${X} did not come 1st.`;f=o=>P(o,x)!==0}
      if(kind==="notTop2"){t=`${X} was not in the top two.`;f=o=>P(o,x)>1}
      if(kind==="place"){const s=rnd(n);t=`${X} came ${ORD[s]}.`;f=o=>P(o,x)===s}
      if(clues.some(c=>c.t===t)||clues.some(c=>c.t===`${Y} ${C.ahead} ${X}.`)){k--;continue}
      clues.push({t,f});
    }
    const valid=all.filter(o=>clues.every(c=>c.f(o)));
    if(valid.length<1) continue;
    if(clues.some((c,i)=>all.filter(o=>clues.every((d,j)=>j===i||d.f(o))).length===valid.length)) continue;
    const listOrders=valid.map((o,i)=>`(${i+1}) ${o.map(i=>names[i]).join(", ")}`).join("   ");
    const board={type:"row",names,labels:ORD.slice(0,n),ends:false};
    if(level===1){
      if(valid.length>2) continue;
      const s=Math.random()<0.5?n-1:rnd(n);
      const ask=s===n-1?`Who ${C.last}?`:s===0?`Who came 1st?`:`Who came ${ORD[s]}?`;
      const answers=valid.map(o=>o[s]); const uniq=[...new Set(answers)];
      if((Math.random()<0.35)!==(uniq.length>1)) continue;
      if(clues.some(c=>c.t.endsWith(`came ${ORD[s]}.`))) continue;
      let pool=uniq.slice(0,3);const others=shuffle([...Array(n).keys()].filter(i=>!pool.includes(i)));
      while(pool.length<3) pool.push(others.shift()); pool=shuffle(pool);
      const opts=pool.map(i=>names[i]).concat([NP]); const a=uniq.length>1?3:pool.indexOf(uniq[0]);
      return {gen:true,board,q:`<p>${C.intro(listNames(names))}</p><ul>${clues.map(c=>`<li>${c.t}</li>`).join("")}</ul><p class="ask">${ask}</p>`,
        opts,a,why:opts.map((o,i)=>i===a?null:i===3?"Only one order fits every clue, so we CAN tell.":answers.includes(pool[i])?`${o} fits one order, but not every one.`:`${o} can't be in that place in any order that fits.`),
        clues:["Write the places 1st to last. Put any fixed places in first.","Go through each person: could they be in that place? Use the “not” clues.",valid.length===1?"Only ONE order fits every clue.":`${valid.length} orders fit every clue. Do they agree?`],
        explain:(valid.length===1?"Only one order fits every clue: ":`${valid.length} orders fit every clue: `)+listOrders+(uniq.length>1?". They disagree, so it is not possible to tell.":".")};
    }
    // levels 2–3: "which one must be true?"
    if(valid.length<2||valid.length>(level===2?4:6)) continue;
    const stmts=[];
    for(let x=0;x<n;x++){for(let y=0;y<n;y++) if(x!==y) stmts.push({t:`${names[x]} ${C.ahead} ${names[y]}.`,f:o=>P(o,x)<P(o,y)});
      for(let s=0;s<n;s++) stmts.push({t:s===0?`${names[x]} came 1st.`:s===n-1?`${names[x]} ${C.last}.`:`${names[x]} came ${ORD[s]}.`,f:o=>P(o,x)===s});
      stmts.push({t:`${names[x]} did not come last.`,f:o=>P(o,x)!==n-1});}
    const fresh=stmts.filter(st=>!clues.some(c=>c.t===st.t));
    const always=shuffle(fresh.filter(st=>valid.every(st.f)&&!all.every(st.f)));
    const sometimes=shuffle(fresh.filter(st=>valid.some(st.f)&&!valid.every(st.f)));
    const never=shuffle(fresh.filter(st=>!valid.some(st.f)));
    if(!always.length||sometimes.length<2) continue;
    const wrong=sometimes.slice(0,level===3?3:2).concat(never.slice(0,1)).slice(0,3);
    if(wrong.length<3) continue;
    const pool=shuffle([always[0]].concat(wrong));
    const a=pool.indexOf(always[0]);
    const why=pool.map(st=>{if(st===always[0])return null;const k=valid.findIndex(o=>!st.f(o));
      return valid.some(st.f)?`Could be true, but not in order (${k+1}): ${valid[k].map(i=>names[i]).join(", ")}. “Must” means true in EVERY order.`:"This can't happen in any order that fits the clues."});
    return {gen:true,board,q:`<p>${C.intro(listNames(names))}</p><ul>${clues.map(c=>`<li>${c.t}</li>`).join("")}</ul><p class="ask">Which one of these <u>must</u> be true?</p>`,
      opts:pool.map(s=>s.t),a,why,
      clues:["Build one order that fits every clue on the scratch board.","Now try to build a DIFFERENT order that also fits. Use “+ Try another arrangement”.",`${valid.length} orders fit. The right answer is true in every one of them.`],
      explain:`${valid.length} orders fit every clue: ${listOrders}. Only “${always[0].t.replace(/\.$/,"")}” is true in all of them.`};
  }
  return null;
}

/* ===== liars and truth-tellers ===== */
const LIAR_CTX=[
  {what:"Someone ate the last biscuit from the tin.",ask:"Who ate the biscuit?",did:"ate it"},
  {what:"Someone let the class hamster out of its cage.",ask:"Who let the hamster out?",did:"let it out"},
  {what:"Someone left the art-room tap running.",ask:"Who left the tap running?",did:"did it"},
  {what:"Someone hid the PE teacher's whistle.",ask:"Who hid the whistle?",did:"hid it"},
  {what:"Someone drew a moustache on the head teacher's portrait.",ask:"Who drew the moustache?",did:"did it"}
];
function genLiars(level){
  level=level||1;
  for(let attempt=0;attempt<4000;attempt++){
    const n=level===1?3:4;
    const names=shuffle(NAME_POOL).slice(0,n).sort();
    const C=LIAR_CTX[rnd(LIAR_CTX.length)];
    const rule=level<3?{liars:1,text:"Exactly one of them is lying. The others are telling the truth."}
      :(Math.random()<0.5?{truth:1,text:"Exactly one of them is telling the truth. The others are all lying."}:{liars:2,text:"Exactly two of them are lying."});
    const st=names.map((N,s)=>{
      const others=[...Array(n).keys()].filter(i=>i!==s);
      const kinds=["me","did","didnt"].concat(level>1?["either","didnt"]:[]).concat(level===3?["either"]:[]);
      const k=kinds[rnd(kinds.length)], x=others[rnd(others.length)];
      let y=others[rnd(others.length)];while(y===x&&others.length>1)y=others[rnd(others.length)];
      if(k==="me") return {t:"I didn't do it.",f:c=>c!==s};
      if(k==="did") return {t:`${names[x]} ${C.did}.`,f:c=>c===x};
      if(k==="didnt") return {t:`It wasn't ${names[x]}.`,f:c=>c!==x};
      const [p,q]=x<y?[x,y]:[y,x]; return {t:`It was either ${names[p]} or ${names[q]}.`,f:c=>c===p||c===q};
    });
    if(new Set(st.map(s=>s.t)).size<n) continue;
    const ok=c=>{const tr=st.filter(s=>s.f(c)).length;return rule.truth?tr===1:(n-tr)===rule.liars};
    const fits=[...Array(n).keys()].filter(ok);
    if(fits.length!==1) continue;
    const culprit=fits[0];
    const askTruth=level===3&&rule.truth&&Math.random()<0.5;
    const truthTeller=st.findIndex(s=>s.f(culprit));
    const opts=names.slice(); if(n===3) opts.push(NP);
    const a=askTruth?truthTeller:culprit;
    const lies=c=>st.filter(s=>!s.f(c)).length;
    const lines=[...Array(n).keys()].map(c=>`If ${names[c]} did it: ${lies(c)} lying${c===culprit?" ✅":" ❌"}`).join(" · ");
    const target=rule.truth?"1 telling the truth":`${rule.liars} lying`;
    return {gen:true,
      board:{type:"grid",title:"Test each suspect",rows:names.map(N=>`If ${N} did it`),cols:names.map(N=>`${N} says`),values:["","T","F"],countF:true},
      q:`<p>${C.what} ${listNames(names)} were asked about it.</p><ul>${st.map((s,i)=>`<li><b>${names[i]}:</b> “${s.t}”</li>`).join("")}</ul><p>${rule.text}</p><p class="ask">${askTruth?"Who was telling the truth?":C.ask}</p>`,
      opts,a,
      why:opts.map((o,i)=>i===a?null:i>=n?"Only one person fits, so we CAN tell.":askTruth?`${o}'s statement is false once you know who did it.`:`If ${o} did it, ${lies(i)} ${lies(i)===1?"person is":"people are"} lying, not ${target}.`),
      clues:["Pretend each person did it, one at a time.","For each one, mark every statement T (true) or F (false) on the grid, then count the lies.",`You want the row with ${target}. Only one row fits.`],
      explain:`${lines}. ${names[culprit]} is the only one that fits “${rule.text.split(".")[0].toLowerCase()}”.${askTruth?` Then only ${names[truthTeller]}'s statement is true.`:""}`};
  }
  return null;
}

/* ===== matching grids ===== */
const ATTRS=[
  {key:"pet",vals:["cat","dog","rabbit","hamster"],pos:v=>`has the ${v}`,neg:v=>`does not have the ${v}`,lab:"Pet"},
  {key:"colour",vals:["red","blue","green","yellow"],pos:v=>`likes ${v} best`,neg:v=>`does not like ${v} best`,lab:"Colour"},
  {key:"inst",vals:["cello","flute","drums","violin"],pos:v=>`plays the ${v}`,neg:v=>`does not play the ${v}`,lab:"Instrument"},
  {key:"snack",vals:["crisps","an apple","popcorn","a banana"],pos:v=>`brought ${v}`,neg:v=>`did not bring ${v}`,lab:"Snack"}
];
function genGrid(level){
  level=level||1;
  for(let attempt=0;attempt<2000;attempt++){
    const n=level===3?4:3, k=level===1?1:2;
    const names=shuffle(NAME_POOL).slice(0,n).sort();
    const at=shuffle(ATTRS).slice(0,k).map(A=>({...A,vals:shuffle(A.vals).slice(0,n)}));
    const P=perms([...Array(n).keys()]);
    let all=P.map(p=>[p]); if(k===2) all=P.flatMap(p=>P.map(q=>[p,q]));   // sol[a][person] = value index
    const sol=all[rnd(all.length)];
    const cand=[];
    for(let p=0;p<n;p++) for(let ai=0;ai<k;ai++) for(let v=0;v<n;v++){
      const A=at[ai],V=A.vals[v];
      if(sol[ai][p]===v) cand.push({t:`${names[p]} ${A.pos(V)}.`,f:s=>s[ai][p]===v,w:1});
      else cand.push({t:`${names[p]} ${A.neg(V)}.`,f:s=>s[ai][p]!==v,w:2});
    }
    if(k===2) for(let v=0;v<n;v++) for(let w=0;w<n;w++){
      const pw=sol[0].indexOf(v), linked=sol[1][pw]===w;
      const s1=at[0].pos(at[0].vals[v]), s2=at[1].pos(at[1].vals[w]), n2=at[1].neg(at[1].vals[w]);
      cand.push(linked?{t:`The person who ${s1} ${s2}.`,f:s=>s[1][s[0].indexOf(v)]===w,w:3}:{t:`The person who ${s1} ${n2}.`,f:s=>s[1][s[0].indexOf(v)]!==w,w:3});
    }
    // weighted shuffle: prefer "not" and linking clues
    let pool=shuffle(cand).sort((x,y)=>(y.w+Math.random()*2)-(x.w+Math.random()*2));
    const clues=[];let valid=all;
    for(const c of pool){ if(valid.length===1) break; const nv=valid.filter(c.f); if(nv.length<valid.length){clues.push(c);valid=nv} }
    if(valid.length!==1) continue;
    const trimmed=trimClues(clues,all,v=>v.length===1);
    const directs=trimmed.filter(c=>c.w===1).length;
    if(directs>(level===1?1:1)) continue;
    if(trimmed.length<(level===1?2:level===2?3:5)||trimmed.length>(level===3?8:6)) continue;
    // question: one true fact, three false
    const facts=[],falses=[];
    for(let p=0;p<n;p++) for(let ai=0;ai<k;ai++) for(let v=0;v<n;v++){
      const t=`${names[p]} ${at[ai].pos(at[ai].vals[v])}.`;
      if(trimmed.some(c=>c.t===t)) continue;
      (sol[ai][p]===v?facts:falses).push(t);
    }
    if(!facts.length||falses.length<3) continue;
    const right=facts[rnd(facts.length)];
    const opts=shuffle([right].concat(shuffle(falses).slice(0,3)));
    const a=opts.indexOf(right);
    const solText=names.map((N,p)=>`${N}: ${at.map(A=>A.vals[sol[at.indexOf(A)][p]]).join(", ")}`).join(" · ");
    return {gen:true,
      board:{type:"grid",title:"Logic grid",rows:names,cols:at.flatMap(A=>A.vals.map(v=>({g:A.lab,v}))),values:["","✗","✓"]},
      q:`<p>${listNames(names)} each ${at.map(A=>A.key==="pet"?"have a different pet":A.key==="colour"?"like a different colour best":A.key==="inst"?"play a different instrument":"brought a different snack").join(" and ")}: ${at.map(A=>listNames(A.vals)).join("; and ")}.</p><ul>${trimmed.map(c=>`<li>${c.t}</li>`).join("")}</ul><p class="ask">Which one of these is correct?</p>`,
      opts,a,
      why:opts.map(o=>o===right?null:"Fill in the grid: this one gets a ✗."),
      clues:["Use the grid. Put ✓ for definite facts and ✗ for every “not” clue.","Each row and each column of a group can only have ONE ✓. When a row has all ✗ but one, the last box is ✓.",k===2?"For “The person who… ” clues, find who that person is first, then use their row.":"Look for a row or column with only one empty box left."],
      explain:`The only way to fit every clue: ${solText}.`};
  }
  return null;
}

function mergeProg(a,b){const o=Object.assign({},a);
  for(const k in b){const y=b[k];
    if(typeof y==="boolean"){o[k]=!!(o[k]||y);continue}
    if(!y||typeof y!=="object")continue;
    const x=o[k];if(!x){o[k]=y;continue}
    const lx=x.lv||{1:x.points||0}, ly=y.lv||{1:y.points||0}, lv={};
    for(const l of [1,2,3]) lv[l]=Math.max(lx[l]||0,ly[l]||0);
    o[k]={best:Math.max(x.best||0,y.best||0),points:lv[1],lv};}
  return o}

function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);
  const W=cv.width=innerWidth,H=cv.height=innerHeight,ctx=cv.getContext("2d");
  const cols=["#dcb76c","#72c9a0","#e2625a","#8fb4ff","#c9a2ff"];
  const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,r:Math.random()*6+3,c:cols[rnd(cols.length)],a:Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.a+=.15;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(++t<110) requestAnimationFrame(f); else cv.remove()})();
}

function buildRound(c,level,originals){
  if(originals&&c.puzzles) return c.puzzles;
  if(c.gen){const r=[];let guard=0;while(r.length<6&&guard++<60){const g=GENS[c.gen](level);if(g)r.push(g)}return r}
  const tagged=[].concat((c.puzzles||[]).map(p=>({...p,lvl:1})),(c.extra||[]).map(p=>({...p,lvl:2})),(c.exam||[]).map(p=>({...p,lvl:3})),c.bank||[]);
  const same=shuffle(tagged.filter(p=>p.lvl===level)), lower=shuffle(tagged.filter(p=>p.lvl<level));
  return shuffle(same.concat(lower).slice(0,6));
}

      <div class="evid">${cs.map((c,i)=>progress[c.id]
        ?`<div class="ev-card open"><span class="label">Evidence ${i+1}</span><p>${esc(c.evidence)}</p></div>`
        :`<div class="ev-card"><span class="label">Evidence ${i+1}</span><p>🔒 Solve ${c.tab} to unlock</p></div>`).join("")}</div>
      <div class="row">${solvedAll(m)?`<button class="btn" data-acc="${mi}">${progress[m.key]?"🏆 See the thief again":"🕵️ Name the thief!"}</button>`
        :`<span class="hint">${cs.filter(c=>progress[c.id]).length} of ${cs.length} pieces of evidence found</span>`}</div></div>
    <div class="folders">${cs.map(folder).join("")}</div></section>`};
  app.innerHTML=`
  <header class="top"><div><p class="label">Critical thinking detective school</p><h1>Clue Crackers</h1></div>
    <div class="badge"><span class="label">Your rank</span><b>${rank()}${playerName?" "+esc(playerName):""}</b><span>🔍 ${totalPoints()} / ${maxPoints()} magnifiers</span>
    <div class="toolbar"><button class="btn ghost mini" id="mode">${mode==="light"?"🌙 Dark mode":"☀️ Light mode"}</button>
    <button class="btn ghost mini" id="snd">${soundOn?"🔊 Sound on":"🔈 Sound off"}</button></div></div></header>
  ${playerName?"":`<section class="card"><p class="label">New recruit</p><h3>What's your detective name?</h3>
    <form class="namebox" id="nameform"><input id="pname" maxlength="20" placeholder="Your name" autocomplete="off"><button class="btn" type="submit">Join the squad</button></form></section>`}
  ${run?`<div class="resume"><div><p class="label">Case in progress</p><b>${esc(CASES[run.ci].title)}</b> · ${LEVELS[run.level||1].tag} · puzzle ${run.pi+1} of ${run.round.length} · 🔍 ${run.pts}</div>
    <div class="row"><button class="btn" id="resume">▶ Carry on</button><button class="btn ghost mini" id="drop">Start fresh</button></div></div>`:""}
  ${MYSTERIES.map(mystery).join("")}
  <div class="grownups"><p class="label">💾 Save code</p>
  <div class="backup"><div class="row"><button class="btn ghost mini" id="copyb">Copy backup code</button><button class="btn ghost mini" id="showr">Restore from a code</button>${playerName?`<button class="btn ghost mini" id="rename">Change name</button>`:""}</div>
    <textarea id="bcode" hidden aria-label="Backup code"></textarea>
    <div class="row" id="rrow" hidden><button class="btn mini" id="dorestore">Restore</button><span class="small" id="bmsg"></span></div></div></div>`;
  app.querySelectorAll(".folder").forEach(b=>b.onclick=()=>{const ci=+b.dataset.i;state={view:"brief",ci,level:unlockedLevel(CASES[ci])};render()});
  app.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>{state={view:"accuse",mi:+b.dataset.acc,wrong:[]};render()});
  document.getElementById("mode").onclick=()=>{mode=mode==="light"?"dark":"light";ls.set(KEY+"-mode",mode);applyMode();render(true)};
  document.getElementById("snd").onclick=()=>{soundOn=!soundOn;ls.set(KEY+"-sound",soundOn?"1":"0");chime(true);render(true)};
  const nf=document.getElementById("nameform"); if(nf) nf.onsubmit=e=>{e.preventDefault();const v=document.getElementById("pname").value.trim();if(v){playerName=v;ls.set(KEY+"-name",v);save();render(true)}};
  const rn=document.getElementById("rename"); if(rn) rn.onclick=()=>{playerName="";ls.del(KEY+"-name");render()};
  const rs=document.getElementById("resume"); if(rs) rs.onclick=()=>{state=Object.assign({view:"puzzle"},run,{level:run.level||1});newPuzzle();if(run.solved&&run.pi<run.round.length-1)state.pi++;render()};
  const dr=document.getElementById("drop"); if(dr) dr.onclick=()=>{clearRun();render(true)};
  const bcode=document.getElementById("bcode"), bmsg=document.getElementById("bmsg");
  const code=()=>btoa(unescape(encodeURIComponent(JSON.stringify({progress,name:playerName,run:loadRun()}))));
  document.getElementById("copyb").onclick=()=>{const c=code();bcode.hidden=false;bcode.value=c;document.getElementById("rrow").hidden=true;
    try{navigator.clipboard.writeText(c).catch(()=>bcode.select())}catch(e){bcode.select()}};
  document.getElementById("showr").onclick=()=>{bcode.hidden=false;bcode.value="";bcode.placeholder="Paste a backup code here";document.getElementById("rrow").hidden=false;bcode.focus()};
  document.getElementById("dorestore").onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob(bcode.value.trim()))));
      if(!d||typeof d.progress!=="object") throw 0; progress=mergeProg(progress,d.progress); save();
      if(d.name){playerName=d.name;ls.set(KEY+"-name",d.name)} if(d.run) ls.set(KEY+"-run",JSON.stringify(d.run)); render();
    }catch(e){bmsg.textContent="That code didn't work. Check you copied all of it."}};
}

/* ----- briefing with level picker ----- */
function brief(){
  const c=CASES[state.ci], ul=unlockedLevel(c), first=!progress[c.id]&&c.puzzles;
  app.innerHTML=`
  <div class="row"><button class="btn ghost" id="back">← All cases</button></div>
  <section class="card"><p class="label">${c.tab} · Briefing</p><h2>${esc(c.title)}</h2>
    <p class="label">The detective's rule — say it out loud</p>
    <div class="rule">${esc(c.rule)}</div>
    <h3>How a good detective does it</h3>
    <ol class="steps">${c.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    <p class="from-test">${esc(c.fromTest)}</p>
    ${first?`<div class="row"><button class="btn" id="orig">Open the case</button></div>`:`
    <p class="label">Choose your level</p>
    <div class="levels">${[1,2,3].map(l=>`<button class="lvbtn ${state.level===l?"on":""}" data-l="${l}" ${l>ul?"disabled":""}>
      <b>${l>ul?"🔒 ":""}${LEVELS[l].tag}</b><span>${LEVELS[l].name}</span><small>${l>ul?`Score ${UNLOCK}+ 🔍 at Level ${l-1} to unlock`:`Best: ${lvPts(c,l)} 🔍`}</small></button>`).join("")}</div>
    <div class="row"><button class="btn" id="go">🎲 Start ${LEVELS[state.level].tag}</button>${c.puzzles?`<button class="btn ghost" id="orig">Replay the originals</button>`:""}</div>
    <p class="hint">${c.gen?"New puzzles are made up fresh every time, and checked by a solver — there's no end to them!":"Each round picks a mix of 6 from the puzzle bank."}</p>`}
  </section>`;
  back();
  app.querySelectorAll(".lvbtn").forEach(b=>b.onclick=()=>{state.level=+b.dataset.l;render(true)});
  const go=document.getElementById("go"); if(go) go.onclick=()=>startCase(state.ci,state.level,false);
  const og=document.getElementById("orig"); if(og) og.onclick=()=>startCase(state.ci,1,true);
}
function startCase(ci,level,originals){state={view:"puzzle",ci,level,pi:0,results:[],pts:0,streak:0,round:buildRound(CASES[ci],level,originals)};newPuzzle();render()}
function newPuzzle(){Object.assign(state,{tries:0,shown:0,picked:[],solved:false,boards:null,marks:null})}

/* ----- puzzle ----- */
function npIndex(p){if(!p.board||p.board.type==="grid")return -1;return p.opts.findIndex(o=>/not possible to tell/i.test(o))}
function puzzle(){
  saveRun();
  const c=CASES[state.ci], R=state.round, p=R[state.pi];
  const dots=R.map((_,i)=>{const r=state.results[i];return `<span class="dot ${r===true?"done":r===false?"miss":""} ${i===state.pi?"now":""}"></span>`}).join("");
  const last=state.picked[state.picked.length-1];
  const recap=npIndex(p)>=0?`<p class="recap">🚨 <b>Trap alert reminder:</b> when “not possible to tell” is an option, don't stop at your first arrangement. <b>List</b> every place the most restricted person (or pair) could go, <b>place</b> everyone else, then <b>tick ✅ or cross ❌</b> each one. One ✅ = that's your answer. Two ✅ that give different answers = not possible to tell.</p>`:"";
  const nextBtn=`<div class="row"><button class="btn" id="next">${state.pi<R.length-1?"Next puzzle →":"Close the case →"}</button></div>`;
  let fb="";
  if(state.solved) fb=`<div class="fb good"><div class="row" style="justify-content:space-between"><strong class="pop-in">${state.praise}</strong><span class="gain">+${state.gain} 🔍</span></div>${state.streak>=2?`<p class="streak">🔥 ${state.streak} in a row!</p>`:""}<p>${esc(p.explain)}</p>${recap}</div>${nextBtn}`;
  else if(state.tries===1) fb=`<div class="fb bad"><strong>Not quite — check this</strong><p>${esc(p.why[last]||"")}</p><p>Look at a clue below, then try again.</p></div>`;
  else if(state.tries>=2) fb=`<div class="fb bad"><strong>The answer is ${L[p.a]}</strong><p>${esc(p.why[last]||"")}</p><p>${esc(p.explain)}</p>${recap}</div>${nextBtn}`;
  const locked=state.solved||state.tries>=2;
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn ghost" id="back">← All cases</button><div class="row" style="gap:14px"><span class="pts">🔍 ${state.pts}</span><div class="dots">${dots}</div></div></div>
  <section class="card">
    <p class="label">${c.tab} · ${LEVELS[state.level].tag} · Puzzle ${state.pi+1} of ${R.length}</p>
    <div class="rule" style="font-size:1rem">${esc(c.rule)}</div>
    <div class="q">${p.q}</div>
    ${npIndex(p)>=0&&!state.solved?`<div class="alert" role="note"><span class="t">🚨 Trap alert: “not possible to tell”</span><p>Found one arrangement? Don't stop yet!</p><ol><li><b>List</b> every place the most restricted person (or pair) could go.</li><li><b>Place</b> everyone else and check every clue.</li><li><b>Tick ✅ or cross ❌</b> each arrangement.</li></ol><p>One ✅ = that's your answer. Two ✅ that give different answers = <b>not possible to tell</b>.</p></div>`:""}
    ${p.board?boardHTML(p.board,p):""}
    <div class="opts">${p.opts.map((o,i)=>{const cls=(locked&&i===p.a)?"right":state.picked.includes(i)?"wrong":"";
      return `<button class="opt ${cls}" data-i="${i}" ${locked||state.picked.includes(i)?"disabled":""}><b>${L[i]}</b><span>${esc(o)}</span></button>`}).join("")}</div>
    ${fb}
    <div class="clues">${p.clues.slice(0,state.shown).map((t,i)=>`<div class="clue"><span class="label">Clue ${i+1}</span><br>${esc(t)}</div>`).join("")}</div>
    ${state.shown<p.clues.length&&!locked?`<div class="row"><button class="btn ghost" id="clue">Need a clue? (${p.clues.length-state.shown} left)</button></div>`:""}
  </section>`;
  back();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const cl=document.getElementById("clue"); if(cl) cl.onclick=()=>{state.shown++;render(true)};
  const nx=document.getElementById("next"); if(nx) nx.onclick=next;
  if(p.board) wireBoard(p.board);
}
function choose(i){
  const p=state.round[state.pi];
  state.tries++; state.picked.push(i);
  if(i===p.a){state.solved=true;state.gain=state.tries===1?(state.shown===0?3:2):1;state.pts+=state.gain;
    state.streak=state.tries===1?state.streak+1:0;state.praise=PRAISE[rnd(PRAISE.length)];confetti();chime(true)}
  else{if(state.tries>=2)state.streak=0;if(state.tries===1&&state.shown===0)state.shown=1;chime(false)}
  if(state.results[state.pi]===undefined&&(state.solved||state.tries>=2)) state.results[state.pi]=(state.solved&&state.tries===1);
  render(true);
}
function next(){
  const c=CASES[state.ci];
  if(state.pi<state.round.length-1){state.pi++;newPuzzle();render();return}
  const score=state.results.filter(Boolean).length, prev=progress[c.id], before=unlockedLevel(c);
  const lv=Object.assign({},prev&&prev.lv?prev.lv:{1:prev&&prev.points||0});
  lv[state.level]=Math.max(lv[state.level]||0,state.pts);
  state.firstSolve=!prev;
  progress[c.id]={best:Math.max(score,prev?prev.best||0:0),points:lv[1]||0,lv};
  state.newLevel=unlockedLevel(c)>before?unlockedLevel(c):0;
  save(); clearRun(); confetti(); chime(true);
  state.view="end"; state.score=score; render();
}
function endView(){
  const c=CASES[state.ci], m=mysteryOf(c), n=state.round.length, s=state.score, ei=m.cases.indexOf(c.id);
  const msg=s===n?"Perfect detective work!":s>=n-2?"Great work, detective.":"Good effort — every case gets easier the second time.";
  app.innerHTML=`
  <section class="card end">
    <p class="label">${c.tab} · ${LEVELS[state.level].tag}</p><h2>${esc(c.title)}</h2>
    <span class="stamp pop">CASE CLOSED</span>
    <p class="stars">🔍 ${state.pts} magnifiers · ${s} / ${n} first try</p>
    <p>${msg} Rank: <b>${rank()}</b></p>
    ${state.newLevel?`<p class="unlocked">🔓 ${LEVELS[state.newLevel].tag} (${LEVELS[state.newLevel].name}) unlocked!</p>`:(state.level<3&&state.pts<UNLOCK?`<p class="hint">Score ${UNLOCK}+ 🔍 in one round to unlock ${LEVELS[state.level+1].tag}.</p>`:"")}
    <div class="ev-card open unlock"><span class="label">${state.firstSolve?"New evidence unlocked!":"Evidence"} · ${esc(m.title)} · Evidence ${ei+1}</span><p>${esc(c.evidence)}</p></div>
    ${solvedAll(m)&&!progress[m.key]?`<button class="btn" id="acc2">🕵️ You have all the evidence — name the thief!</button>`:""}
    <div class="row" style="justify-content:center"><button class="btn" id="home">Back to the case files</button><button class="btn ghost" id="again">🎲 Play again</button></div>
  </section>`;
  document.getElementById("home").onclick=()=>{state={view:"home"};render()};
  document.getElementById("again").onclick=()=>{state={view:"brief",ci:state.ci,level:unlockedLevel(c)};render()};
  const a2=document.getElementById("acc2"); if(a2) a2.onclick=()=>{state={view:"accuse",mi:MYSTERIES.indexOf(m),wrong:[]};render()};
}

/* ----- final accusation ----- */
function accuse(){
  const m=MYSTERIES[state.mi], caught=state.caught||progress[m.key];
  app.innerHTML=`
  <div class="row"><button class="btn ghost" id="back">← All cases</button></div>
  <section class="card"><p class="label">Mystery ${state.mi+1} · Final case</p><h2>Who did it?</h2>
    <p>Use all the evidence to rule suspects out. Only one person fits every clue.</p>
    <div class="evid">${m.cases.map((id,i)=>`<div class="ev-card open"><span class="label">Evidence ${i+1}</span><p>${esc(caseById(id).evidence)}</p></div>`).join("")}</div>
    <div class="suspects">${m.suspects.map((p,i)=>{const out=state.wrong.includes(i), win=caught&&i===m.thief;
      return `<button class="suspect ${out?"out":""} ${win?"win":""}" data-i="${i}" ${out||caught?"disabled":""}>
        <span class="face">${p.face}</span><b>${p.name}</b><small>${p.role}</small>
        <span class="chips">${m.traits.map(([k,y,nn])=>`<span class="chip">${p[k]?y:nn}</span>`).join("")}</span>
        ${out?`<span class="stamp">ALIBI</span>`:""}${win?`<span class="stamp">GUILTY</span>`:""}</button>`}).join("")}</div>
    ${state.msg?`<div class="fb bad"><strong>Not them!</strong><p>${esc(state.msg)}</p></div>`:""}
    ${caught?`<div class="fb good"><strong>Case closed!</strong><p>${esc(m.win)}</p></div>`:""}
  </section>`;
  back();
  app.querySelectorAll(".suspect").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(i===m.thief){state.caught=true;state.msg="";progress[m.key]=true;save();confetti();setTimeout(confetti,400);chime(true)}
    else{state.wrong.push(i);state.msg=m.suspects[i].alibi;chime(false)}
    render(true)});
}

/* ----- scratch boards: rows, circles and grids ----- */
function boardHTML(b,p){
  if(b.type==="grid") return gridHTML(b);
  const n=b.names.length, k=npIndex(p);
  if(!state.boards){state.boards=[Array(n).fill(-1)];state.marks=[null]}
  const seatBtn=(a,i,label)=>{const v=state.boards[a][i];
    return `<button class="seat ${v>=0?"filled":""}" data-a="${a}" data-s="${i}" aria-label="Arrangement ${a+1}, ${label}: ${v>=0?b.names[v]:"empty"}">${v>=0?esc(b.names[v]):"?"}<small>${label}</small></button>`};
  const one=a=>{let inner="";
    if(b.type==="row"){const labels=b.labels||b.names.map((_,i)=>"Seat "+(i+1));
      inner=`<div class="seats-row" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${labels.map((l,i)=>seatBtn(a,i,l)).join("")}</div>${b.ends===false?"":`<div class="ends"><span>← left</span><span>right →</span></div>`}`;
    } else {const r=38;let seats="",arrows="";
      for(let i=0;i<n;i++){const ang=Math.PI/2+i*2*Math.PI/n,x=50+r*Math.cos(ang),y=50+r*Math.sin(ang);
        arrows+=`<line x1="${50+24*Math.cos(ang)}" y1="${50+24*Math.sin(ang)}" x2="${50+14*Math.cos(ang)}" y2="${50+14*Math.sin(ang)}" stroke="var(--muted)" stroke-width="1" marker-end="url(#ah${a})"/>`;
        seats+=`<div style="position:absolute;left:${x}%;top:${y}%">${seatBtn(a,i,i===0?"bottom":"seat")}</div>`}
      inner=`<div class="circle-box"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><marker id="ah${a}" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="var(--muted)"/></marker></defs>
        <circle cx="50" cy="50" r="27" fill="none" stroke="var(--line)" stroke-width="1"/>${arrows}</svg>${seats}</div><div class="ends"><span>← bottom person's left</span><span>bottom person's right →</span></div>`}
    const m=state.marks[a];
    return `<div class="arr ${m||""}"><div class="row" style="justify-content:space-between"><span class="label">Arrangement ${a+1}${m==="ok"?" ✅":m==="no"?" ❌":""}</span>
      <div class="row" style="gap:6px"><button class="btn ghost mini ${m==="ok"?"on":""}" data-mark="ok" data-a="${a}">✅ Fits</button><button class="btn ghost mini ${m==="no"?"on":""}" data-mark="no" data-a="${a}">❌ Breaks a clue</button>
      ${a>0?`<button class="btn ghost mini" data-del="${a}">Remove</button>`:`<button class="btn ghost mini" data-clr="0">Clear</button>`}</div></div>${inner}</div>`};
  const ticks=state.marks.filter(x=>x==="ok").length;
  return `<div class="board"><span class="label">Scratch board</span>
    <p class="hint">Tap a box to cycle through the names. ${b.type==="circle"?"Everyone faces the middle (arrows). For the person at the bottom, their left is your left.":"Fill in the fixed facts first."}</p>
    ${k>=0?`<p class="np-hint">🔎 Option ${L[k]} says “not possible to tell”. <b>Will there be another arrangement?</b> Use “+ Try another arrangement” to check.</p>`:""}
    ${state.boards.map((_,a)=>one(a)).join("")}
    <div class="row" style="justify-content:space-between">${state.boards.length<4?`<button class="btn ghost" id="addArr">+ Try another arrangement</button>`:"<span></span>"}
      ${ticks>=2?`<span class="hint">${ticks} arrangements fit. Do they give the same answer? If not → not possible to tell.</span>`:""}</div></div>`;
}
function gridHTML(b){
  const R=b.rows.length, C=b.cols.length;
  if(!state.boards){state.boards=[Array(R*C).fill(0)];state.marks=[null]}
  const g=state.boards[0], colLab=c=>typeof c==="string"?c:c.v.replace(/^(a|an) /,"");
  const groups=typeof b.cols[0]==="string"?null:b.cols.reduce((a,c)=>{if(!a.length||a[a.length-1].g!==c.g)a.push({g:c.g,n:0});a[a.length-1].n++;return a},[]);
  let h=`<div class="scroll"><table class="lgrid">`;
  if(groups) h+=`<tr><th></th>${groups.map(x=>`<th colspan="${x.n}" class="grp">${esc(x.g)}</th>`).join("")}${b.countF?"<th></th>":""}</tr>`;
  h+=`<tr><th></th>${b.cols.map(c=>`<th class="ch"><span>${esc(colLab(c))}</span></th>`).join("")}${b.countF?`<th class="ch"><span>Lies</span></th>`:""}</tr>`;
  for(let r=0;r<R;r++){
    h+=`<tr><th class="rh">${esc(b.rows[r])}</th>`;
    for(let c=0;c<C;c++){const v=b.values[g[r*C+c]];h+=`<td><button class="cell v${g[r*C+c]}" data-cell="${r*C+c}" aria-label="${esc(b.rows[r])}, ${esc(colLab(b.cols[c]))}: ${v||"empty"}">${v}</button></td>`}
    if(b.countF){const f=b.cols.reduce((t,_,c)=>t+(b.values[g[r*C+c]]==="F"?1:0),0);h+=`<td class="cnt">${f}</td>`}
    h+=`</tr>`;
  }
  h+=`</table></div>`;
  return `<div class="board"><div class="row" style="justify-content:space-between"><span class="label">${esc(b.title||"Scratch grid")}</span><button class="btn ghost mini" data-clr="0">Clear</button></div>
    <p class="hint">Tap a box to cycle: ${b.values.slice(1).join(" → ")} → empty.${b.countF?" The last column counts the lies (F) in each row.":""}</p>${h}</div>`;
}
function wireBoard(b){
  if(b.type==="grid"){
    app.querySelectorAll("[data-cell]").forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.cell;state.boards[0][i]=(state.boards[0][i]+1)%b.values.length;render(true)});
    app.querySelectorAll("[data-clr]").forEach(btn=>btn.onclick=()=>{state.boards[0]=state.boards[0].map(()=>0);render(true)});
    return;
  }
  const n=b.names.length;
  app.querySelectorAll(".seat").forEach(btn=>btn.onclick=()=>{const a=+btn.dataset.a,i=+btn.dataset.s;let v=state.boards[a][i]+1;if(v>=n)v=-1;state.boards[a][i]=v;render(true)});
  app.querySelectorAll("[data-mark]").forEach(btn=>btn.onclick=()=>{const a=+btn.dataset.a,m=btn.dataset.mark;state.marks[a]=state.marks[a]===m?null:m;render(true)});
  app.querySelectorAll("[data-del]").forEach(btn=>btn.onclick=()=>{const a=+btn.dataset.del;state.boards.splice(a,1);state.marks.splice(a,1);render(true)});
  app.querySelectorAll("[data-clr]").forEach(btn=>btn.onclick=()=>{state.boards[0]=Array(n).fill(-1);state.marks[0]=null;render(true)});
  const add=document.getElementById("addArr"); if(add) add.onclick=()=>{state.boards.push(Array(n).fill(-1));state.marks.push(null);render(true)};
}

/* a link like …?restore=CODE loads a save code once */
(function(){try{const q=new URLSearchParams(location.search).get("restore");if(!q)return;
  const d=JSON.parse(decodeURIComponent(escape(atob(q.trim()))));
  if(d&&typeof d.progress==="object"){progress=mergeProg(progress,d.progress);save();
    if(d.name&&!playerName){playerName=d.name;ls.set(KEY+"-name",d.name)}
    if(d.run&&!loadRun()) ls.set(KEY+"-run",JSON.stringify(d.run));}
  history.replaceState(null,"",location.pathname);}catch(e){}})();
render();
cloudInit();
</script>
